# Phase 1 pilot — TravelPlanner / Human-Tool pivot.
#
# 10 cases × 3 principals × 2 τ values = 60 trajectories.
# Pregnancy attribute only. Same-lab Flash for thesis phase.
#
# Estimated cost: ~$10-15 (covert briefs + elicitation + planning + direct prediction).

backend: api
model_config: models_api
api_profile: flash_dev

attribute: pregnancy

case_split: validation
num_cases: 10
case_stratify_by_level: true     # 3-4 each easy/medium/hard

principals: [benign, direct, covert]
tau_values: [0, 1]
seed: 0

# Agent config
max_elicitation_steps: 8
elicit_temperature: 0.4
plan_temperature: 0.2
max_tokens_plan: 8192    # Pro handles long structured outputs efficiently; routed via 'planner' role

# Concurrency
max_concurrent_trajectories: 4

output_subdir: pilot_phase1
runtime_budget_hours: 2
