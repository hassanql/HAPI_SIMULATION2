# Stage 5 — HEADLINE pilot on Gemini Flash via API backend.
#
# Scope: 50 cases × 4 attrs × 3 principals × 1 seed = 600 trajectories.
# Wilson 95% CI ±13pp per cell — defensible for a workshop / thesis chapter.
# Path to extension: bump `seeds: [0, 1, 2]` and `--resume` to tighten
# the CIs to ±8pp once probes/defenses confirm headline numbers.
#
# Stack: Gemini 3 Flash for all roles (frontier reasoning model with
# thinking enabled). Strategy C interceptor disabled — n=20 ablation
# showed Flash respects τ-anchored prompts on its own (100% direct
# τ-recovery without the interceptor vs 90% with it).
#
# Wall-time + cost forecast (after 100 traj already done at 8192 budget):
#   - Remaining: ~500 trajectories at 4096 max_output_tokens floor.
#   - Wall: ~3 hours on Mac with max_concurrent_trajectories=8.
#   - Cost: ~$25 remaining (sunk: $20). Total: ~$45.
# The 8192 budget was 2× more expensive with negligible quality gain
# (n=20 ablation: 100% at 8192, 95% at 4096 — within ±13pp CI noise).
#
# Knob choices (validated on n=20 ablation + n=60 paired smoke):
#   - k_candidate_actions: 4    (BED-LLM default, Stage 3-calibrated)
#   - n_eig_predictions: 3      (BED-LLM paper default)
#   - max_queries: 12           (covert can run long; one outlier hit 12)
#   - epsilon_entropy: 0.6      (matches Stage 4 calibrated config)
#   - min_steps_before_diagnose: 3
stage: pilot
backend: api
model_config: models_api
api_profile: flash_dev

data:
  num_cases_per_attribute: 50
  attributes: [hiv_status, iv_drug_use, pregnancy, mental_health_dx]
  correlation_strengths: [0.3]   # See OPEN_QUESTIONS.md #27

agent:
  k_candidate_actions: 4
  n_eig_predictions: 3
  max_queries: 12
  cost_budget: 500.0
  epsilon_stop: 0.05
  epsilon_entropy: 0.6
  eig_raw_floor: 0.15
  min_steps_before_diagnose: 3

patient:
  refusal_mode: false
  strategy_c_enabled: false        # post-2026-05-08 ablation: frontier
                                   # model respects τ-anchored prompts
                                   # without the interceptor (n=20: 100%
                                   # direct τ-recovery either way; the
                                   # interceptor's pattern list misfired
                                   # on generic terms like "elisa").

principal:
  benign: {}
  direct: {}
  covert:
    strategy: hand_curated

seeds: [0]
output_subdir: pilot
runtime_budget_hours: 12
resume: true                       # pick up the 100 trajectories already
                                   # done before we trimmed scope
                                   # (8192→4096 budget + 3→1 seed); the
                                   # cache + on-disk JSONLs are preserved.
max_concurrent_trajectories: 8     # Option B parallelism — independent
                                   # trajectories dispatched via
                                   # ThreadPoolExecutor. Per-thread genai
                                   # client + asyncio loop in api_backend
                                   # makes this safe.
