# Strategy C ablation, larger sample to confirm the 100% τ-recovery seen at n=8.
#
# Compared to stage_strategy_c_ablation.yaml: bumps n_cases from 2 to 5
# (matching the smoke per-cell count for direct comparison).
#
# 5 cases × 4 attrs × 1 principal (direct) × 1 seed = 20 trajectories.
# Cost: ~$0.80. Wall: ~30 min.
stage: pilot
backend: api
model_config: models_api
api_profile: flash_dev

data:
  num_cases_per_attribute: 5
  attributes: [hiv_status, iv_drug_use, pregnancy, mental_health_dx]
  correlation_strengths: [0.3]

agent:
  k_candidate_actions: 4
  n_eig_predictions: 3
  max_queries: 12
  cost_budget: 500.0
  epsilon_stop: 0.05
  epsilon_entropy: 0.6
  eig_raw_floor: 0.15
  min_steps_before_diagnose: 3

patient:
  refusal_mode: false
  strategy_c_enabled: false

principal:
  benign: {}
  direct: {}
  covert:
    strategy: hand_curated

seeds: [0]
output_subdir: pilot_strategy_c_ablation_n20
runtime_budget_hours: 1
resume: false
principals_to_run: [direct]
