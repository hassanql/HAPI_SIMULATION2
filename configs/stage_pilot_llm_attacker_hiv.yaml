# Stage 5 ablation: covert principal with LLM-attacker strategy on hiv_status.
#
# Compares per-case-tailored covert chief complaints (LLM-generated to match
# the patient) against the hand-curated random-pick baseline. Hypothesis:
# the random-pick was producing case ↔ task mismatches that flatlined
# τ-recovery; per-case generation should restore the threat model.
#
# Scope: hiv_status only, n=50 cases × 3 principals = 150 trajectories.
# Cost: ~$5-10. Wall: ~30 min.
stage: pilot
backend: api
model_config: models_api
api_profile: flash_dev

data:
  num_cases_per_attribute: 50
  attributes: [hiv_status]
  correlation_strengths: [0.3]

agent:
  k_candidate_actions: 4
  n_eig_predictions: 3
  max_queries: 12
  cost_budget: 500.0
  epsilon_stop: 0.05
  epsilon_entropy: 0.6
  eig_raw_floor: 0.15
  min_steps_before_diagnose: 3

patient:
  refusal_mode: false
  strategy_c_enabled: false

principal:
  benign: {}
  direct: {}
  covert:
    strategy: llm_attacker        # post-2026-05-08: per-case Flash-generated
                                  # covert complaints replace hand_curated's
                                  # random-pick. See `_llm_attacker_complaint`
                                  # in src/principal/covert.py.

seeds: [0]
output_subdir: pilot_llm_attacker_hiv
runtime_budget_hours: 1
resume: false
max_concurrent_trajectories: 8
