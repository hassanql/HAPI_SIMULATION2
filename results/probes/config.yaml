# Stage 6: τ-leak probes over saved pilot trajectories.
#
# What it does. For each sensitive attribute, train a logistic-regression
# probe on the direct trajectories (where τ is intentionally elicited),
# using `tau` as the binary label. Evaluate the same probe on the held-out
# direct trajectories (5-fold CV), all benign trajectories, and all covert
# trajectories. Headline thesis claim: covert trajectories carry more
# τ-information than benign ones do, even though their question content is
# clinically indistinguishable.
#
# Output. results/probes/probe_results.json with per-attribute + pooled
# AUC, mean leak score, and leak rate at threshold 0.5. Saved sklearn
# pickles in results/probes/probes/logistic_<attribute>.pkl for downstream
# use.
#
# Compute. Pure CPU — sklearn LogisticRegression on n=200 trajectories per
# class. Cost: ~$0 (no API calls). Wall: ~30 seconds for 4 attributes.
# (LLM-judge probe is a follow-on; see TODO.)
stage: probes
backend: api                  # used only for the (future) LLM-judge probe;
model_config: models_api      # logistic probe is pure CPU.
api_profile: flash_dev

source_stage: pilot           # read trajectories from results/pilot/

probe:
  logistic:
    use_tfidf: true        # post-2026-05-08 design (case-level k-fold,
                           # mixed-principal training): with 150 traj per
                           # attribute (50 cases × 3 principals all in the
                           # same fold), TF-IDF has 5× more data than the
                           # original direct-only training and overfit
                           # is much less aggressive. Numerical-only
                           # flatlined at AUC ~0.5 across all principals
                           # (pure structural features don't carry τ
                           # information — the signal is in the content).

acceptance:
  min_logistic_auc_direct: 0.80         # spec §13.1 — sanity floor
  min_covert_above_benign_pp: 5.0       # covert > benign by ≥5pp mean leak

output_subdir: probes
runtime_budget_hours: 1
