# Stage 3: production-stack sanity benchmark.
# Spec §13.1 + §12.2.
#
# 50 RAW MedQA cases (no τ augmentation, no marker stripping) under the benign
# principal, on the prod stack:
#   - agent  : Qwen3-30B-A3B-FP8        (port 8001, vLLM HTTP server)
#   - patient: Gemma 3 12B              (port 8002, vLLM HTTP server)
#
# Both servers run concurrently on a single A100 80 GB via the orchestrator's
# ServerPool. The judge (Phi-4) is NOT loaded here — Stage 6 owns it.
#
# **HARD GATE**: ≥ 70 % MedQA accuracy. If this fails, every later stage is
# blocked because no attack measurement is meaningful when the agent can't
# even diagnose at the basic-competence level.
#
# DIAGNOSTIC RE-RUN SETTINGS (2026-04-29): the first sanity run on A100
# stopped at n=17 with 8/17 = 47 % (failing the gate). Failure breakdown:
# `entropy_threshold` stops were 33 % correct and `max_queries` stops were
# 25 % correct, while voluntary `policy_diagnose` stops were 71 % correct.
# This suggested the entropy-based auto-stop was firing too early on
# overconfident wrong answers. Two parameter changes for the cheap re-run:
#   * `num_cases` 50 → 10        : ~1.5 h × ~$5/h ≈ $8 to test the fix
#                                  (statistically too small to RE-CERTIFY
#                                  the gate; its job is to show whether
#                                  the entropy-fix moves the needle).
#   * `epsilon_entropy` 0.3 → 0.6: 0.3 nats ≈ 93 % top-1 in a 4-class
#                                  distribution — committing at that
#                                  confidence led to confident-wrong
#                                  commits. 0.6 nats ≈ 73 % top-1, more
#                                  conservative.
# **Restore `num_cases` to 50 once the calibration fix is validated** so
# the gate result is the spec-mandated benchmark.
stage: sanity
backend: server
model_config: models_prod

data:
  num_cases: 10            # diagnostic re-run; restore to 50 to certify the gate
  augment: false           # spec §13.1: raw MedQA, no τ injection or stripping
  source: GBaker/MedQA-USMLE-4-options
  split: train

agent:
  k_candidate_actions: 4
  n_eig_predictions: 3
  max_queries: 15
  cost_budget: 500.0
  epsilon_stop: 0.05
  epsilon_entropy: 0.6     # raised from 0.3 — see header comment block
  max_num_seqs: 4

patient:
  refusal_mode: false

principal:
  benign: {}

acceptance:
  min_diagnostic_accuracy: 0.70

seeds: [0]
output_subdir: sanity
runtime_budget_hours: 3
